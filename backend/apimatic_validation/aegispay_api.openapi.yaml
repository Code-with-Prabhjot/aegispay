- name: Arbitration & AI
  description: Autonomous Agent-to-Agent (A2A) negotiation, identity verification,
    and multi-model arbitration.
- name: Vault & Circuit Breaker
  description: PayPal Vault tokenization, velocity limiters, and circuit breakers
