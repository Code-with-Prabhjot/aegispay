components:
  schemas:
    A2ANegotiateRequest:
      properties:
        buyer_pref:
          additionalProperties: true
          type: object
          title: Buyer Pref
          description: Buyer preferences (max_budget_micros, max_timeout_seconds)
        worker_pref:
          additionalProperties: true
          type: object
          title: Worker Pref
          description: Worker preferences (min_budget_micros, min_timeout_seconds)
        alpha:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Alpha
          description: Buyer price sensitivity weight
          default: 0.5
        beta:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Beta
          description: Worker price sensitivity weight
          default: 0.5
        task_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Description
          description: Task description
          default: Autonomous Agent Deliverable
        runtime_language:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Language
          description: Target runtime
          default: python
        buyer_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer Agent Id
          description: Buyer DID or agent ID
        worker_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Agent Id
          description: Worker DID or agent ID
        auto_sign:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Sign
          description: Whether to automatically sign generated offer
          default: false
      type: object
      required:
      - buyer_pref
      - worker_pref
      title: A2ANegotiateRequest
    A2ANegotiateResponse:
      properties:
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: Negotiated SLA parameters
        offer:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Offer
          description: Signed SLA offer document
        agreement_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agreement Id
          description: Proposed or created agreement ID
        contract_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contract Id
          description: Contract ID alias
        buyer_did:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer Did
          description: Buyer DID key
        worker_did:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Did
          description: Worker DID key
        auth_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Auth Id
          description: PayPal authorization ID if created
        contract_created:
          type: boolean
          title: Contract Created
          description: Whether escrow authorization was generated
          default: false
        agreed_budget_micros:
          type: integer
          title: Agreed Budget Micros
          description: Final agreed budget in micro-dollars
        max_execution_seconds:
          type: number
          title: Max Execution Seconds
          description: Max execution timeout
        agreed_timeout_seconds:
          type: number
          title: Agreed Timeout Seconds
          description: Agreed SLA timeout
        buyer_utility:
          type: number
          title: Buyer Utility
          description: Buyer utility score
        worker_utility:
          type: number
          title: Worker Utility
          description: Worker utility score
        nash_product:
          type: number
          title: Nash Product
          description: Nash bargaining product
        status:
          type: string
          title: Status
          description: Negotiation status
      type: object
      required:
      - parameters
      - agreed_budget_micros
      - max_execution_seconds
      - agreed_timeout_seconds
      - buyer_utility
      - worker_utility
      - nash_product
      - status
      title: A2ANegotiateResponse
    AgreementDetailResponse:
      properties:
        agreement_id:
          type: string
          title: Agreement Id
          description: Unique SLA contract identifier
        buyer_agent_id:
          type: string
          title: Buyer Agent Id
          description: Identifier of the buyer agent
        worker_agent_id:
          type: string
          title: Worker Agent Id
          description: Identifier of the worker agent
        worker_paypal_email:
          type: string
          title: Worker Paypal Email
          description: PayPal receiver email for payout
        budget_micros:
          type: integer
          title: Budget Micros
          description: Agreed escrow budget in micro-dollars
        task_description:
          type: string
          title: Task Description
          description: Task requirements and SLA description
        timeout_seconds:
          type: integer
          title: Timeout Seconds
          description: Execution timeout in seconds
        fsm_state:
