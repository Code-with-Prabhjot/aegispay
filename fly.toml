# fly.toml app configuration file for AegisPay (backend only)
# First deploy:
#   fly volumes create aegispay_data --size 1 --region ord
#   fly secrets set API_AUTH_KEY=$(openssl rand -hex 32)
#   fly deploy
# Without API_AUTH_KEY the public API (including code submission) is open to anyone.

app = "aegispay"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PAYPAL_MODE = "mock"
  DATABASE_URL = "sqlite:////app/data/aegispay.db"
  PORT = "8000"
  # Set to the dashboard's public origin so its WebSocket is accepted.
  CORS_ALLOWED_ORIGINS = "http://localhost:3000"

# SQLite lives on this volume; without it every restart (including auto-stop) wipes the state.
[mounts]
  source = "aegispay_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"
